<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Exam Question Bank">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17324a"/>
      <stop offset="1" stop-color="#0c1c2b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b980"/>
      <stop offset="1" stop-color="#c9897b"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="url(#gold)" stroke-opacity=".45" stroke-width="1.5"/>

  <!-- chakra: eight spokes = the exam cycle -->
  <g transform="translate(32 32)" fill="none" stroke="url(#gold)" stroke-linecap="round">
    <circle r="16.5" stroke-width="2.6"/>
    <circle r="5"    stroke-width="2.6" fill="url(#gold)" stroke="none"/>
    <g stroke-width="2.2">
      <path d="M0 -16.5V-5.5"/>
      <path d="M0 5.5V16.5"/>
      <path d="M-16.5 0H-5.5"/>
      <path d="M5.5 0H16.5"/>
      <path d="M-11.7 -11.7L-3.9 -3.9"/>
      <path d="M3.9 3.9L11.7 11.7"/>
      <path d="M11.7 -11.7L3.9 -3.9"/>
      <path d="M-3.9 3.9L-11.7 11.7"/>
    </g>
  </g>
</svg>
