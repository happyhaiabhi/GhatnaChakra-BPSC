<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BPSC Polity PYQ Revision</title>
<style>
  :root {
    --bg: #0f1419;
    --bg2: #1a2332;
    --bg3: #243044;
    --card: #1e2a3a;
    --border: #2d3a4d;
    --text: #e8eef5;
    --muted: #8b9cb3;
    --accent: #3b82f6;
    --accent2: #60a5fa;
    --green: #22c55e;
    --green-bg: rgba(34,197,94,.15);
    --red: #ef4444;
    --red-bg: rgba(239,68,68,.15);
    --orange: #f59e0b;
    --orange-bg: rgba(245,158,11,.15);
    --purple: #a78bfa;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  a { color: var(--accent2); text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; }

  /* Layout */
  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 300px; min-width: 300px;
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    overflow: hidden;
  }
  .sidebar-head {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-head h1 {
    font-size: 1.05rem; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .sidebar-head p { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
  .progress-wrap { margin-top: 12px; }
  .progress-bar {
    height: 8px; background: var(--bg3); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--green));
    border-radius: 99px; transition: width .35s ease; width: 0%;
  }
  .progress-meta {
    display: flex; justify-content: space-between;
    font-size: 0.72rem; color: var(--muted); margin-top: 6px;
  }

  .search-box {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .search-box input {
    width: 100%; padding: 9px 12px;
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.85rem;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }

  .topic-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .topic-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    padding: 10px 12px; border-radius: 8px;
    background: transparent; color: var(--text);
    margin-bottom: 2px; transition: background .15s;
  }
  .topic-item:hover { background: var(--bg3); }
  .topic-item.active {
    background: rgba(59,130,246,.18);
    outline: 1px solid rgba(59,130,246,.4);
  }
  .topic-item .rank {
    font-size: 0.65rem; font-weight: 700; color: var(--muted);
    min-width: 18px;
  }
  .topic-item .name { flex: 1; font-size: 0.82rem; font-weight: 500; }
  .topic-item .badge {
    font-size: 0.68rem; font-weight: 600;
    padding: 2px 7px; border-radius: 99px;
    background: var(--bg3); color: var(--muted);
  }
  .topic-item .badge.done { background: var(--green-bg); color: var(--green); }
  .topic-item .badge.partial { background: var(--orange-bg); color: var(--orange); }

  .sidebar-foot {
    padding: 12px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .btn-sm {
    flex: 1; min-width: 40%;
    padding: 8px 10px; border-radius: 8px;
    font-size: 0.75rem; font-weight: 600;
    background: var(--bg3); color: var(--text);
  }
  .btn-sm:hover { background: var(--border); }
  .btn-sm.danger { color: var(--red); }

  /* Main */
  .main {
    flex: 1; overflow-y: auto;
    padding: 24px 28px 60px;
    max-width: 900px;
  }
  .topbar {
    display: flex; flex-wrap: wrap; gap: 12px;
    align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .topbar h2 { font-size: 1.35rem; font-weight: 700; }
  .topbar .sub { font-size: 0.85rem; color: var(--muted); }
  .mode-toggle {
    display: flex; background: var(--bg2); border-radius: 10px;
    padding: 3px; border: 1px solid var(--border);
  }
  .mode-toggle button {
    padding: 8px 16px; border-radius: 8px;
    font-size: 0.8rem; font-weight: 600;
    background: transparent; color: var(--muted);
  }
  .mode-toggle button.active {
    background: var(--accent); color: #fff;
  }

  /* Home dashboard */
  .dash-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
  }
  .stat-card .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .value { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.blue { color: var(--accent2); }

  .topic-cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 12px;
  }
  .tcard {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    cursor: pointer; transition: border-color .15s, transform .1s;
    text-align: left; color: var(--text); width: 100%;
  }
  .tcard:hover { border-color: var(--accent); transform: translateY(-1px); }
  .tcard h3 { font-size: 0.95rem; margin-bottom: 8px; }
  .tcard .meta { font-size: 0.78rem; color: var(--muted); display: flex; justify-content: space-between; }
  .tcard .mini-bar {
    height: 4px; background: var(--bg3); border-radius: 99px;
    margin-top: 10px; overflow: hidden;
  }
  .tcard .mini-fill {
    height: 100%; background: var(--accent); border-radius: 99px;
  }

  /* Question card */
  .q-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .q-meta {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 14px;
  }
  .chip {
    font-size: 0.7rem; font-weight: 600;
    padding: 3px 9px; border-radius: 99px;
    background: var(--bg3); color: var(--muted);
  }
  .chip.exam { background: rgba(59,130,246,.15); color: var(--accent2); }
  .chip.status-correct { background: var(--green-bg); color: var(--green); }
  .chip.status-wrong { background: var(--red-bg); color: var(--red); }
  .chip.status-skip { background: var(--orange-bg); color: var(--orange); }

  .q-stem {
    font-size: 1.02rem; font-weight: 500;
    margin-bottom: 16px; line-height: 1.55;
  }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt {
    display: flex; gap: 12px; align-items: flex-start;
    width: 100%; text-align: left;
    padding: 12px 14px; border-radius: 10px;
    background: var(--bg2); border: 1.5px solid var(--border);
    color: var(--text); font-size: 0.9rem;
    transition: border-color .12s, background .12s;
  }
  .opt:hover:not(:disabled) { border-color: var(--accent); }
  .opt:disabled { cursor: default; }
  .opt .key {
    font-weight: 700; color: var(--accent2);
    min-width: 22px;
  }
  .opt.selected { border-color: var(--accent); background: rgba(59,130,246,.12); }
  .opt.correct {
    border-color: var(--green); background: var(--green-bg);
  }
  .opt.correct .key { color: var(--green); }
  .opt.wrong {
    border-color: var(--red); background: var(--red-bg);
  }
  .opt.wrong .key { color: var(--red); }

  .q-actions {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 16px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 9px 16px; border-radius: 8px;
    font-size: 0.85rem; font-weight: 600;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-primary:disabled { opacity: .45; cursor: not-allowed; }
  .btn-ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--muted); }
  .btn-success { background: var(--green); color: #fff; }
  .feedback {
    margin-top: 12px; padding: 10px 14px; border-radius: 8px;
    font-size: 0.88rem; font-weight: 600;
  }
  .feedback.ok { background: var(--green-bg); color: var(--green); }
  .feedback.bad { background: var(--red-bg); color: var(--red); }
  .feedback.info { background: var(--orange-bg); color: var(--orange); }

  .nav-row {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 8px; margin-bottom: 24px;
  }

  .quiz-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .quiz-counter {
    font-size: 0.9rem; color: var(--muted);
  }
  .quiz-counter strong { color: var(--text); }

  /* Results */
  .results-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; text-align: center;
  }
  .results-box .score {
    font-size: 3rem; font-weight: 800;
    background: linear-gradient(135deg, var(--accent2), var(--green));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .results-box p { color: var(--muted); margin: 8px 0 20px; }
  .results-stats {
    display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
    margin-bottom: 20px;
  }
  .results-stats div { text-align: center; }
  .results-stats .n { font-size: 1.4rem; font-weight: 700; }
  .results-stats .l { font-size: 0.75rem; color: var(--muted); }

  .empty {
    text-align: center; padding: 60px 20px; color: var(--muted);
  }

  .mobile-bar {
    display: none;
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg2); border-top: 1px solid var(--border);
    padding: 10px 14px; z-index: 50;
    gap: 8px;
  }

  @media (max-width: 800px) {
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      z-index: 100; transform: translateX(-100%);
      transition: transform .25s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .main { padding: 16px 14px 80px; max-width: 100%; }
    .mobile-bar { display: flex; }
    .backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 90;
    }
    .backdrop.show { display: block; }
  }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px;
  }
  .filter-row button {
    padding: 6px 12px; border-radius: 99px;
    font-size: 0.75rem; font-weight: 600;
    background: var(--bg2); color: var(--muted);
    border: 1px solid var(--border);
  }
  .filter-row button.on {
    background: rgba(59,130,246,.2); color: var(--accent2);
    border-color: var(--accent);
  }

  .kbd {
    font-size: 0.65rem; padding: 1px 5px; border-radius: 4px;
    background: var(--bg3); color: var(--muted);
    border: 1px solid var(--border);
  }
</style>
</head>
<body>
<div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h1>BPSC Polity PYQs</h1>
      <p>Topic-wise revision · Laxmikanth mapped</p>
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="globalProgress"></div></div>
        <div class="progress-meta">
          <span id="globalProgressText">0 / 0 attempted</span>
          <span id="globalAccuracy">—</span>
        </div>
      </div>
    </div>
    <div class="search-box">
      <input type="search" id="topicSearch" placeholder="Search topics..." oninput="renderTopicList()" />
    </div>
    <div class="topic-list" id="topicList"></div>
    <div class="sidebar-foot">
      <button class="btn-sm" onclick="showHome()">Dashboard</button>
      <button class="btn-sm" onclick="startAllQuiz()">Quiz All</button>
      <button class="btn-sm" onclick="showWrongOnly()">Wrong only</button>
      <button class="btn-sm danger" onclick="resetProgress()">Reset</button>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div class="mobile-bar">
  <button class="btn btn-ghost" style="flex:1" onclick="toggleSidebar()">Topics</button>
  <button class="btn btn-primary" style="flex:1" onclick="showHome()">Home</button>
</div>

const STORAGE_KEY = 'bpsc_polity_pyq_v1';

function loadState() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { answers: {} };
  } catch { return { answers: {} }; }
}
function saveState(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}
let state = loadState();

// qid helper
function qid(topicId, exam, qno) {
  return topicId + '::' + exam + '::' + qno;
}

function allQuestionsFlat() {
  const out = [];
  DATA.topics.forEach(t => {
    t.questions.forEach((q, idx) => {
      out.push({ ...q, topicId: t.id, topicName: t.name, idx });
    });
  });
  return out;
}

function getProgress() {
  const all = allQuestionsFlat();
  let attempted = 0, correct = 0, wrong = 0;
  const byTopic = {};
  DATA.topics.forEach(t => {
    byTopic[t.id] = { total: t.count, attempted: 0, correct: 0, wrong: 0 };
  });
  all.forEach(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    const a = state.answers[id];
    if (!a) return;
    attempted++;
    byTopic[q.topicId].attempted++;
    if (a.result === 'correct') { correct++; byTopic[q.topicId].correct++; }
    else if (a.result === 'wrong') { wrong++; byTopic[q.topicId].wrong++; }
  });
  return { total: all.length, attempted, correct, wrong, byTopic };
}

function updateSidebarProgress() {
  const p = getProgress();
  const pct = p.total ? (p.attempted / p.total * 100) : 0;
  document.getElementById('globalProgress').style.width = pct + '%';
  document.getElementById('globalProgressText').textContent =
    p.attempted + ' / ' + p.total + ' attempted';
  const acc = (p.correct + p.wrong) ? Math.round(p.correct / (p.correct + p.wrong) * 100) : null;
  document.getElementById('globalAccuracy').textContent =
    acc !== null ? acc + '% accuracy' : '—';
}

let activeTopicId = null;
let viewMode = 'home'; // home | browse | quiz | results
let quizQueue = [];
let quizIndex = 0;
let quizSelected = null;
let quizRevealed = false;
let browseFilter = 'all'; // all | unattempted | wrong | correct

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

function renderTopicList() {
  const q = (document.getElementById('topicSearch').value || '').toLowerCase();
  const p = getProgress();
  const el = document.getElementById('topicList');
  el.innerHTML = '';

  // Home shortcut
  const homeBtn = document.createElement('button');
  homeBtn.className = 'topic-item' + (viewMode === 'home' && !activeTopicId ? ' active' : '');
  homeBtn.innerHTML = '<span class="rank">⌂</span><span class="name">Dashboard</span>';
  homeBtn.onclick = () => { showHome(); closeSidebar(); };
  el.appendChild(homeBtn);

  DATA.topics.forEach((t, i) => {
    if (q && !t.name.toLowerCase().includes(q)) return;
    const tp = p.byTopic[t.id];
    let badgeClass = '';
    let badgeText = t.count;
    if (tp.attempted === t.count && t.count > 0) {
      badgeClass = 'done';
      badgeText = '✓ ' + t.count;
    } else if (tp.attempted > 0) {
      badgeClass = 'partial';
      badgeText = tp.attempted + '/' + t.count;
    }
    const btn = document.createElement('button');
    btn.className = 'topic-item' + (activeTopicId === t.id ? ' active' : '');
    btn.innerHTML =
      '<span class="rank">' + (i + 1) + '</span>' +
      '<span class="name">' + escapeHtml(t.name) + '</span>' +
      '<span class="badge ' + badgeClass + '">' + badgeText + '</span>';
    btn.onclick = () => { openTopic(t.id); closeSidebar(); };
    el.appendChild(btn);
  });
  updateSidebarProgress();
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showHome() {
  activeTopicId = null;
  viewMode = 'home';
  renderTopicList();
  const p = getProgress();
  const acc = (p.correct + p.wrong) ? Math.round(p.correct / (p.correct + p.wrong) * 100) : 0;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2>Revision Dashboard</h2>
        <div class="sub">115 BPSC Polity PYQs · ranked by exam weight</div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="stat-card"><div class="label">Total PYQs</div><div class="value blue">${p.total}</div></div>
      <div class="stat-card"><div class="label">Attempted</div><div class="value">${p.attempted}</div></div>
      <div class="stat-card"><div class="label">Correct</div><div class="value green">${p.correct}</div></div>
      <div class="stat-card"><div class="label">Wrong</div><div class="value red">${p.wrong}</div></div>
      <div class="stat-card"><div class="label">Accuracy</div><div class="value">${(p.correct+p.wrong)?acc+'%':'—'}</div></div>
      <div class="stat-card"><div class="label">Topics</div><div class="value">${DATA.topics.length}</div></div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
      <button class="btn btn-primary" onclick="startAllQuiz()">Start full quiz (all topics)</button>
      <button class="btn btn-ghost" onclick="startUnattemptedQuiz()">Quiz unattempted only</button>
      <button class="btn btn-ghost" onclick="showWrongOnly()">Revise wrong answers</button>
    </div>
    <h3 style="margin-bottom:12px;font-size:1rem">Topics by priority (PYQ count)</h3>
    <div class="topic-cards" id="topicCards"></div>
  `;
  const cards = document.getElementById('topicCards');
  DATA.topics.forEach((t, i) => {
    const tp = p.byTopic[t.id];
    const pct = t.count ? (tp.attempted / t.count * 100) : 0;
    const btn = document.createElement('button');
    btn.className = 'tcard';
    btn.onclick = () => openTopic(t.id);
    btn.innerHTML = `
      <h3>#${i+1} ${escapeHtml(t.name)}</h3>
      <div class="meta">
        <span>${t.count} questions</span>
        <span>${tp.correct}✓ ${tp.wrong}✗ · ${tp.attempted}/${t.count}</span>
      </div>
      <div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div>
    `;
    cards.appendChild(btn);
  });
}

function openTopic(topicId, mode) {
  activeTopicId = topicId;
  const topic = DATA.topics.find(t => t.id === topicId);
  if (!topic) return;
  if (mode === 'quiz') {
    startTopicQuiz(topicId);
    return;
  }
  viewMode = 'browse';
  browseFilter = 'all';
  renderTopicList();
  renderBrowse(topic);
}

function renderBrowse(topic) {
  const p = getProgress();
  const tp = p.byTopic[topic.id];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="topbar">
      <div>
        <h2>${escapeHtml(topic.name)}</h2>
        <div class="sub">${topic.count} PYQs · ${tp.attempted} attempted · ${tp.correct} correct</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <div class="mode-toggle">
          <button class="active" id="modeBrowse">Browse</button>
          <button id="modeQuiz" onclick="startTopicQuiz('${topic.id}')">Quiz</button>
        </div>
      </div>
    </div>
    <div class="filter-row">
      <button class="on" data-f="all" onclick="setBrowseFilter('all', this)">All</button>
      <button data-f="unattempted" onclick="setBrowseFilter('unattempted', this)">Unattempted</button>
      <button data-f="wrong" onclick="setBrowseFilter('wrong', this)">Wrong</button>
      <button data-f="correct" onclick="setBrowseFilter('correct', this)">Correct</button>
    </div>
    <div id="browseList"></div>
  `;
  paintBrowseList(topic);
}

function setBrowseFilter(f, btn) {
  browseFilter = f;
  document.querySelectorAll('.filter-row button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  const topic = DATA.topics.find(t => t.id === activeTopicId);
  paintBrowseList(topic);
}

function paintBrowseList(topic) {
  const list = document.getElementById('browseList');
  list.innerHTML = '';
  let shown = 0;
  topic.questions.forEach((q, idx) => {
    const id = qid(topic.id, q.exam, q.q_no);
    const a = state.answers[id];
    if (browseFilter === 'unattempted' && a) return;
    if (browseFilter === 'wrong' && (!a || a.result !== 'wrong')) return;
    if (browseFilter === 'correct' && (!a || a.result !== 'correct')) return;
    shown++;
    list.appendChild(buildQuestionCard(topic, q, idx, { interactive: true, showNav: false }));
  });
  if (!shown) {
    list.innerHTML = '<div class="empty">No questions in this filter.</div>';
  }
}

function buildQuestionCard(topic, q, idx, opts) {
  const id = qid(topic.id, q.exam, q.q_no);
  const saved = state.answers[id];
  const wrap = document.createElement('div');
  wrap.className = 'q-card';
  wrap.id = 'qcard-' + id.replace(/[^a-z0-9]/gi, '_');

  let statusChip = '';
  if (saved) {
    statusChip = `<span class="chip status-${saved.result}">${saved.result}</span>`;
  }

  const meta = document.createElement('div');
  meta.className = 'q-meta';
  meta.innerHTML = `
    <span class="chip exam">${escapeHtml(q.exam)}</span>
    <span class="chip">Q${q.q_no}</span>
    <span class="chip">${escapeHtml(topic.name)}</span>
    ${statusChip}
  `;
  wrap.appendChild(meta);

  const stem = document.createElement('div');
  stem.className = 'q-stem';
  stem.textContent = (idx + 1) + '. ' + q.stem;
  wrap.appendChild(stem);

  const optionsDiv = document.createElement('div');
  optionsDiv.className = 'options';
  optionsDiv.dataset.qid = id;

  const revealed = opts.forceReveal || (saved && opts.interactive);
  const selectedKey = opts.selectedKey || (saved ? saved.chosen : null);

  q.options.forEach(opt => {
    if (!opt.key && !opt.text) return;
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.dataset.key = opt.key;
    b.innerHTML = `<span class="key">${escapeHtml(opt.key || '•')}.</span><span>${escapeHtml(opt.text)}</span>`;

    if (opts.interactive && !revealed) {
      b.onclick = () => selectOption(topic, q, idx, opt.key, wrap, opts);
    } else {
      b.disabled = true;
    }

    if (selectedKey && opt.key === selectedKey) b.classList.add('selected');

    if (revealed && q.answer) {
      if (opt.key === q.answer) b.classList.add('correct');
      else if (opt.key === selectedKey && selectedKey !== q.answer) b.classList.add('wrong');
    } else if (revealed && saved) {
      if (opt.key === saved.chosen && saved.result === 'correct') b.classList.add('correct');
      if (opt.key === saved.chosen && saved.result === 'wrong') b.classList.add('wrong');
      if (q.answer && opt.key === q.answer) b.classList.add('correct');
    }

    optionsDiv.appendChild(b);
  });
  wrap.appendChild(optionsDiv);

  const actions = document.createElement('div');
  actions.className = 'q-actions';

  if (opts.interactive) {
    if (!revealed) {
      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn btn-primary';
      checkBtn.textContent = 'Check answer';
      checkBtn.onclick = () => {
        const sel = wrap.querySelector('.opt.selected');
        if (!sel) { alert('Select an option first'); return; }
        selectOption(topic, q, idx, sel.dataset.key, wrap, { ...opts, forceCheck: true });
      };
      actions.appendChild(checkBtn);

      const revealBtn = document.createElement('button');
      revealBtn.className = 'btn btn-ghost';
      revealBtn.textContent = 'Reveal answer';
      revealBtn.onclick = () => revealAnswer(topic, q, idx, wrap);
      actions.appendChild(revealBtn);
    } else {
      const fb = document.createElement('div');
      if (saved) {
        fb.className = 'feedback ' + (saved.result === 'correct' ? 'ok' : saved.result === 'wrong' ? 'bad' : 'info');
        fb.textContent = saved.result === 'correct'
          ? 'Correct ✓  Answer: ' + (q.answer || saved.chosen)
          : saved.result === 'wrong'
            ? 'Wrong ✗  Correct answer: ' + (q.answer || 'see key')
            : 'Answer: ' + (q.answer || 'N/A');
      } else if (q.answer) {
        fb.className = 'feedback info';
        fb.textContent = 'Answer: ' + q.answer;
      }
      wrap.appendChild(fb);

      const clearBtn = document.createElement('button');
      clearBtn.className = 'btn btn-ghost';
      clearBtn.textContent = 'Clear & retry';
      clearBtn.onclick = () => {
        delete state.answers[id];
        saveState(state);
        renderTopicList();
        const t = DATA.topics.find(x => x.id === topic.id);
        paintBrowseList(t);
      };
      actions.appendChild(clearBtn);
    }
  }

  if (opts.quizMode) {
    // handled externally
  }

  wrap.appendChild(actions);
  return wrap;
}

function selectOption(topic, q, idx, key, wrap, opts) {
  const id = qid(topic.id, q.exam, q.q_no);
  // highlight selection
  wrap.querySelectorAll('.opt').forEach(o => {
    o.classList.toggle('selected', o.dataset.key === key);
  });

  if (!opts.forceCheck && opts.interactive) {
    // just select, wait for check
    return;
  }

  // grade
  let result = 'skip';
  if (q.answer) {
    result = (key === q.answer) ? 'correct' : 'wrong';
  } else {
    result = 'correct'; // no answer key — mark chosen as noted
  }
  state.answers[id] = { chosen: key, result, ts: Date.now() };
  saveState(state);
  renderTopicList();

  // re-render this card revealed
  const parent = wrap.parentNode;
  const next = buildQuestionCard(topic, q, idx, { interactive: true, forceReveal: true, selectedKey: key });
  parent.replaceChild(next, wrap);
}

function revealAnswer(topic, q, idx, wrap) {
  const id = qid(topic.id, q.exam, q.q_no);
  if (!state.answers[id]) {
    state.answers[id] = { chosen: q.answer || '', result: 'skip', ts: Date.now() };
    saveState(state);
  }
  renderTopicList();
  const parent = wrap.parentNode;
  const next = buildQuestionCard(topic, q, idx, {
    interactive: true,
    forceReveal: true,
    selectedKey: state.answers[id].chosen
  });
  parent.replaceChild(next, wrap);
}

/* ===== QUIZ MODE ===== */
function startTopicQuiz(topicId) {
  const topic = DATA.topics.find(t => t.id === topicId);
  if (!topic) return;
  activeTopicId = topicId;
  quizQueue = topic.questions.map((q, idx) => ({ ...q, topicId: topic.id, topicName: topic.name, idx }));
  quizIndex = 0;
  quizSelected = null;
  quizRevealed = false;
  viewMode = 'quiz';
  renderTopicList();
  renderQuiz();
}

function startAllQuiz() {
  activeTopicId = null;
  quizQueue = allQuestionsFlat();
  // shuffle lightly stable by keeping topic order but shuffle within? keep priority order
  quizIndex = 0;
  quizSelected = null;
  quizRevealed = false;
  viewMode = 'quiz';
  renderTopicList();
  renderQuiz();
}

function startUnattemptedQuiz() {
  quizQueue = allQuestionsFlat().filter(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    return !state.answers[id];
  });
  if (!quizQueue.length) {
    alert('No unattempted questions left. Great work!');
    return;
  }
  activeTopicId = null;
  quizIndex = 0;
  quizSelected = null;
  quizRevealed = false;
  viewMode = 'quiz';
  renderTopicList();
  renderQuiz();
}

function showWrongOnly() {
  quizQueue = allQuestionsFlat().filter(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    return state.answers[id] && state.answers[id].result === 'wrong';
  });
  if (!quizQueue.length) {
    alert('No wrong answers saved yet. Attempt some quizzes first!');
    return;
  }
  // clear their saved state so they can retry fresh? keep but allow re-answer
  activeTopicId = null;
  quizIndex = 0;
  quizSelected = null;
  quizRevealed = false;
  viewMode = 'quiz';
  renderTopicList();
  renderQuiz();
}

function renderQuiz() {
  const main = document.getElementById('main');
  if (!quizQueue.length) {
    main.innerHTML = '<div class="empty">No questions in queue.</div>';
    return;
  }
  if (quizIndex >= quizQueue.length) {
    showQuizResults();
    return;
  }
  const q = quizQueue[quizIndex];
  const topic = DATA.topics.find(t => t.id === q.topicId) || { id: q.topicId, name: q.topicName, questions: [] };

  main.innerHTML = `
    <div class="quiz-header">
      <div class="quiz-counter">Question <strong>${quizIndex + 1}</strong> / ${quizQueue.length}
        <span style="margin-left:8px;color:var(--muted)">· ${escapeHtml(q.topicName || topic.name || '')}</span>
      </div>
      <div class="mode-toggle">
        <button onclick="openTopic('${q.topicId}')">Browse topic</button>
        <button class="active">Quiz</button>
      </div>
    </div>
    <div id="quizCard"></div>
    <div class="nav-row">
      <button class="btn btn-ghost" onclick="quizPrev()" ${quizIndex===0?'disabled':''}>← Previous</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" onclick="quizSkip()">Skip</button>
        <button class="btn btn-primary" id="quizNextBtn" onclick="quizNext()">${quizIndex===quizQueue.length-1?'Finish':'Next →'}</button>
      </div>
    </div>
  `;

  const cardWrap = document.getElementById('quizCard');
  const card = document.createElement('div');
  card.className = 'q-card';

  card.innerHTML = `
    <div class="q-meta">
      <span class="chip exam">${escapeHtml(q.exam)}</span>
      <span class="chip">Q${q.q_no}</span>
    </div>
    <div class="q-stem">${escapeHtml(q.stem)}</div>
    <div class="options" id="quizOpts"></div>
    <div class="q-actions">
      <button class="btn btn-primary" id="quizCheck" onclick="quizCheck()">Check answer</button>
      <button class="btn btn-ghost" onclick="quizReveal()">Reveal</button>
    </div>
    <div id="quizFb"></div>
  `;
  cardWrap.appendChild(card);

  const opts = document.getElementById('quizOpts');
  q.options.forEach(opt => {
    if (!opt.key && !opt.text) return;
    const b = document.createElement('button');
    b.className = 'opt' + (quizSelected === opt.key ? ' selected' : '');
    b.type = 'button';
    b.innerHTML = `<span class="key">${escapeHtml(opt.key||'•')}.</span><span>${escapeHtml(opt.text)}</span>`;
    if (!quizRevealed) {
      b.onclick = () => {
        quizSelected = opt.key;
        renderQuiz();
      };
    } else {
      b.disabled = true;
      if (q.answer && opt.key === q.answer) b.classList.add('correct');
      if (quizSelected && opt.key === quizSelected && quizSelected !== q.answer) b.classList.add('wrong');
      if (quizSelected && opt.key === quizSelected) b.classList.add('selected');
    }
    opts.appendChild(b);
  });

  if (quizRevealed) {
    const fb = document.getElementById('quizFb');
    const id = qid(q.topicId, q.exam, q.q_no);
    const saved = state.answers[id];
    if (saved) {
      fb.className = 'feedback ' + (saved.result === 'correct' ? 'ok' : saved.result === 'wrong' ? 'bad' : 'info');
      fb.textContent = saved.result === 'correct'
        ? 'Correct ✓'
        : (saved.result === 'wrong' ? ('Wrong ✗  Correct: ' + (q.answer || '—')) : ('Answer: ' + (q.answer || '—')));
    }
    document.getElementById('quizCheck').disabled = true;
  }
}

function quizCheck() {
  if (!quizSelected) { alert('Select an option first'); return; }
  const q = quizQueue[quizIndex];
  const id = qid(q.topicId, q.exam, q.q_no);
  let result = 'skip';
  if (q.answer) result = (quizSelected === q.answer) ? 'correct' : 'wrong';
  else result = 'correct';
  state.answers[id] = { chosen: quizSelected, result, ts: Date.now() };
  saveState(state);
  quizRevealed = true;
  renderTopicList();
  renderQuiz();
}

function quizReveal() {
  const q = quizQueue[quizIndex];
  const id = qid(q.topicId, q.exam, q.q_no);
  if (!state.answers[id]) {
    state.answers[id] = { chosen: quizSelected || q.answer || '', result: 'skip', ts: Date.now() };
    saveState(state);
  }
  if (!quizSelected && q.answer) quizSelected = q.answer;
  quizRevealed = true;
  renderTopicList();
  renderQuiz();
}

function quizNext() {
  if (!quizRevealed && quizSelected) {
    quizCheck();
    // after check, user clicks next again — or auto advance? better require explicit next after seeing result
    return;
  }
  quizIndex++;
  quizSelected = null;
  quizRevealed = false;
  if (quizIndex >= quizQueue.length) showQuizResults();
  else renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function quizPrev() {
  if (quizIndex <= 0) return;
  quizIndex--;
  quizSelected = null;
  quizRevealed = false;
  // restore previous selection if any
  const q = quizQueue[quizIndex];
  const id = qid(q.topicId, q.exam, q.q_no);
  if (state.answers[id]) {
    quizSelected = state.answers[id].chosen;
    quizRevealed = true;
  }
  renderQuiz();
}

function quizSkip() {
  quizIndex++;
  quizSelected = null;
  quizRevealed = false;
  if (quizIndex >= quizQueue.length) showQuizResults();
  else renderQuiz();
}

function showQuizResults() {
  viewMode = 'results';
  // score only questions in this queue that were answered during session — use saved state for queue items
  let c = 0, w = 0, s = 0;
  quizQueue.forEach(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    const a = state.answers[id];
    if (!a) return;
    if (a.result === 'correct') c++;
    else if (a.result === 'wrong') w++;
    else s++;
  });
  const answered = c + w;
  const pct = answered ? Math.round(c / answered * 100) : 0;
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="results-box">
      <div style="font-size:0.85rem;color:var(--muted);margin-bottom:8px">Quiz complete</div>
      <div class="score">${pct}%</div>
      <p>${c} correct out of ${answered} answered · ${quizQueue.length} in queue</p>
      <div class="results-stats">
        <div><div class="n" style="color:var(--green)">${c}</div><div class="l">Correct</div></div>
        <div><div class="n" style="color:var(--red)">${w}</div><div class="l">Wrong</div></div>
        <div><div class="n" style="color:var(--orange)">${s}</div><div class="l">Revealed/Skip</div></div>
        <div><div class="n">${quizQueue.length}</div><div class="l">Total</div></div>
      </div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="retryWrongFromQueue()">Retry wrong</button>
        <button class="btn btn-ghost" onclick="restartSameQueue()">Restart quiz</button>
        <button class="btn btn-ghost" onclick="showHome()">Dashboard</button>
      </div>
    </div>
  `;
  renderTopicList();
}

function retryWrongFromQueue() {
  quizQueue = quizQueue.filter(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    return state.answers[id] && state.answers[id].result === 'wrong';
  });
  // clear those answers for fresh try
  quizQueue.forEach(q => {
    const id = qid(q.topicId, q.exam, q.q_no);
    delete state.answers[id];
  });
  saveState(state);
  if (!quizQueue.length) { alert('No wrongs in this set!'); showHome(); return; }
  quizIndex = 0; quizSelected = null; quizRevealed = false;
  viewMode = 'quiz';
  renderQuiz();
}

function restartSameQueue() {
  // rebuild from topic or all — simplest: reset index
  if (activeTopicId) startTopicQuiz(activeTopicId);
  else startAllQuiz();
}

function resetProgress() {
  if (!confirm('Clear all saved progress on this device?')) return;
  state = { answers: {} };
  saveState(state);
  showHome();
  renderTopicList();
}

// keyboard shortcuts in quiz
document.addEventListener('keydown', (e) => {
  if (viewMode !== 'quiz' || quizRevealed) {
    if (viewMode === 'quiz' && (e.key === 'Enter' || e.key === 'ArrowRight')) {
      e.preventDefault(); quizNext();
    }
    return;
  }
  const k = e.key.toUpperCase();
  if (['A','B','C','D','E'].includes(k)) {
    const q = quizQueue[quizIndex];
    if (q && q.options.some(o => o.key === k)) {
      quizSelected = k;
      renderQuiz();
    }
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    if (quizSelected) quizCheck();
  }
});

// init
showHome();
renderTopicList();
</script>
