      <g transform="rotate(60)"><ellipse cx="20" cy="0" rx="13" ry="7.5"/></g>
      <g transform="rotate(120)"><ellipse cx="20" cy="0" rx="13" ry="7.5"/></g>
      <g transform="rotate(180)"><ellipse cx="20" cy="0" rx="13" ry="7.5"/></g>
      <g transform="rotate(240)"><ellipse cx="20" cy="0" rx="13" ry="7.5"/></g>
      <g transform="rotate(300)"><ellipse cx="20" cy="0" rx="13" ry="7.5"/></g>
    </g>
    <g transform="translate(42,166)">
